[project]
name = "job-tailor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "groq",
    "pydantic",
    "jinja2",
    "playwright",
    "pdfplumber",
    "snowballstemmer",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
